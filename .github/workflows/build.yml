name: Build cua-driver (ARM64 musl)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'trycua/cua ref (branch, tag, or commit)'
        required: false
        default: 'main'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout upstream cua
        uses: actions/checkout@v4
        with:
          repository: trycua/cua
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 1

      - name: Build natively inside Alpine musl (arm64)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src/libs/cua-driver/rust \
            alpine:3.23 sh -euxc '
              apk add --no-cache build-base cargo rustup pkgconf \
                dbus-dev libx11-dev libxtst-dev libxrandr-dev libxi-dev \
                glib-dev wayland-dev
              /usr/bin/rustup-init -y --profile minimal --default-toolchain 1.97.1 --no-modify-path
              export PATH=/root/.cargo/bin:$PATH
              # Alpine ships gcc without a `cc` symlink; point Rust at it explicitly.
              export CC=gcc CXX=g++ AR=ar
              cargo build --locked --release -p cua-driver
            '

      - name: Verify binary
        run: |
          file libs/cua-driver/rust/target/release/cua-driver
          mkdir -p artifact
          cp libs/cua-driver/rust/target/release/cua-driver artifact/cua-driver
          sha256sum artifact/cua-driver > artifact/SHA256SUMS

      - name: Upload cua-driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: cua-driver-aarch64-unknown-linux-musl
          path: artifact/
          if-no-files-found: error
          retention-days: 30